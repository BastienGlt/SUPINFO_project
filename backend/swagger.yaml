openapi: 3.0.0
info:
  title: Supinfo Projet API
  version: 1.0.0
  description: API critique de jeux vidéo pour le projet Supinfo

servers:
  - url: http://localhost:5000
    description: Serveur de développement

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT Auth0

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        auth0_id:
          type: string
        prenom:
          type: string
        nom:
          type: string
        pseudo:
          type: string
        email:
          type: string
        bio:
          type: string
        photo:
          type: string
        role_id:
          type: integer
        created_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required:
        - prenom
        - nom
        - pseudo
      properties:
        prenom:
          type: string
        nom:
          type: string
        pseudo:
          type: string
        bio:
          type: string

    UserUpdate:
      type: object
      properties:
        prenom:
          type: string
        nom:
          type: string
        pseudo:
          type: string
        bio:
          type: string
        photo:
          type: string

    Rating:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        oeuvre_id:
          type: integer
        note:
          type: number
          minimum: 0
          maximum: 5
        contenu:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RatingCreate:
      type: object
      required:
        - note
      properties:
        note:
          type: number
          minimum: 0
          maximum: 5
          description: Note entre 0 et 5
        contenu:
          type: string
          description: Texte de la critique (optionnel)

    RatingStats:
      type: object
      properties:
        oeuvre_id:
          type: integer
        moyenne:
          type: number
        total:
          type: integer
        distribution:
          type: object

    Commentaire:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        critique_id:
          type: integer
        contenu:
          type: string
          maxLength: 2000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CommentaireCreate:
      type: object
      required:
        - contenu
      properties:
        contenu:
          type: string
          maxLength: 2000

    Liste:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        nom:
          type: string
        description:
          type: string
        visibilite:
          type: string
          enum: [PUBLIQUE, PRIVEE]
        created_at:
          type: string
          format: date-time

    ListeCreate:
      type: object
      required:
        - nom
      properties:
        nom:
          type: string
        description:
          type: string
        visibilite:
          type: string
          enum: [PUBLIQUE, PRIVEE]
          default: PRIVEE

    ListeUpdate:
      type: object
      properties:
        nom:
          type: string
        description:
          type: string
        visibilite:
          type: string
          enum: [PUBLIQUE, PRIVEE]

    BibliothequeItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        oeuvre_id:
          type: integer
        statut:
          type: string
        created_at:
          type: string
          format: date-time

    BibliothequeItemCreate:
      type: object
      required:
        - oeuvre_id
      properties:
        oeuvre_id:
          type: integer
        statut:
          type: string

    BibliothequeItemUpdate:
      type: object
      properties:
        statut:
          type: string

    FollowStats:
      type: object
      properties:
        followers:
          type: integer
        following:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string

    Success:
      type: object
      properties:
        message:
          type: string

tags:
  - name: Users
    description: Gestion des utilisateurs
  - name: Followers
    description: Système de follow/unfollow
  - name: Critiques
    description: Notes et critiques des oeuvres
  - name: Commentaires
    description: Commentaires sur les critiques
  - name: Bibliotheque
    description: Bibliothèque personnelle de l'utilisateur
  - name: Listes
    description: Listes personnalisées d'oeuvres

paths:

  # ==================== USERS ====================

  /users/me:
    get:
      tags: [Users]
      summary: Récupérer l'utilisateur connecté
      description: Retourne les données de l'utilisateur authentifié. Retourne 404 avec is_new=true si le profil n'existe pas encore.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Profil non créé (nouvel utilisateur)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  is_new:
                    type: boolean
                  prefill:
                    type: object
                    properties:
                      email:
                        type: string
                      photo:
                        type: string
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/create:
    post:
      tags: [Users]
      summary: Créer un profil utilisateur
      description: Crée le profil après la première connexion Auth0. L'email et la photo sont extraits du token JWT.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Profil créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Champs obligatoires manquants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Pseudo ou email déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      tags: [Users]
      summary: Récupérer un utilisateur par ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: ID invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Users]
      summary: Modifier un utilisateur
      description: Nécessite d'être le propriétaire ou un admin (role_id=3).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Aucune donnée à mettre à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission refusée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Pseudo déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Users]
      summary: Supprimer un utilisateur
      description: Nécessite d'être le propriétaire ou un admin (role_id=3).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Utilisateur supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission refusée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/ratings:
    get:
      tags: [Users]
      summary: Récupérer toutes les notes d'un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Liste des notes
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/ratings/{oeuvreId}:
    get:
      tags: [Users]
      summary: Récupérer la note d'un utilisateur pour une oeuvre spécifique
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: oeuvreId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Note trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '404':
          description: Note non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== FOLLOWERS ====================

  /users/{id}/follow:
    post:
      tags: [Followers]
      summary: Suivre un utilisateur
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur à suivre
      responses:
        '201':
          description: Abonnement créé
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Impossible de se suivre soi-même
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Déjà abonné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Followers]
      summary: Ne plus suivre un utilisateur
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur à ne plus suivre
      responses:
        '200':
          description: Désabonnement réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Abonnement non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/followers:
    get:
      tags: [Followers]
      summary: Récupérer les abonnés d'un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Liste des abonnés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: ID invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/following:
    get:
      tags: [Followers]
      summary: Récupérer les abonnements d'un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Liste des abonnements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: ID invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/follow-stats:
    get:
      tags: [Followers]
      summary: Récupérer les statistiques de suivi d'un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Statistiques de suivi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowStats'
        '400':
          description: ID invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/is-following:
    get:
      tags: [Followers]
      summary: Vérifier si l'utilisateur connecté suit un autre utilisateur
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur cible
      responses:
        '200':
          description: Résultat de la vérification
          content:
            application/json:
              schema:
                type: object
                properties:
                  isFollowing:
                    type: boolean
        '400':
          description: ID invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== CRITIQUES ====================

  /critiques/{id}/ratings:
    get:
      tags: [Critiques]
      summary: Récupérer toutes les notes d'une oeuvre
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'oeuvre
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: orderBy
          in: query
          schema:
            type: string
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        '200':
          description: Liste des notes et statistiques
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Critiques]
      summary: Créer une note pour une oeuvre
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'oeuvre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingCreate'
      responses:
        '201':
          description: Note créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          description: Note invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Oeuvre déjà notée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Critiques]
      summary: Mettre à jour une note existante pour une oeuvre
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'oeuvre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingCreate'
      responses:
        '200':
          description: Note mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          description: Note invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Note non trouvée (utiliser POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /critiques/{id}/ratings/stats:
    get:
      tags: [Critiques]
      summary: Récupérer les statistiques de notation d'une oeuvre
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'oeuvre
      responses:
        '200':
          description: Statistiques de notation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingStats'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /critiques/{id}:
    delete:
      tags: [Critiques]
      summary: Supprimer une critique/note
      description: Seul l'auteur peut supprimer sa note.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la critique
      responses:
        '200':
          description: Note supprimée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Note non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /critiques/{id}/like:
    post:
      tags: [Critiques]
      summary: Liker une critique
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la critique
      responses:
        '201':
          description: Like ajouté
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Critique déjà likée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Critiques]
      summary: Retirer le like d'une critique
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la critique
      responses:
        '200':
          description: Like retiré
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Like non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== COMMENTAIRES ====================

  /commentaires/critiques/{id}:
    post:
      tags: [Commentaires]
      summary: Créer un commentaire sur une critique
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la critique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentaireCreate'
      responses:
        '201':
          description: Commentaire créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commentaire'
        '400':
          description: Contenu invalide ou trop long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
