services:
  db:
    image: mysql:8.0
    env_file:
      - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-supinfo_password}
      MYSQL_DATABASE: ${DB_NAME:-supinfo_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-supinfo_password}
      DB_NAME: ${DB_NAME:-supinfo_db}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://dev-7q8y8bzgwgz5k5j1.eu.auth0.com/api/v2/}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev-7q8y8bzgwgz5k5j1.eu.auth0.com}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
        VITE_RAWG_API_KEY: ${VITE_RAWG_API_KEY}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
