openapi: 3.0.0
info:
  title: Supinfo Projet API
  version: 1.0.0
  description: API critique de jeux vidéo pour le projet Supinfo

servers:
  - url: http://localhost:5000
    description: Serveur de développement

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT Auth0

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        auth0_id:
          type: string
        prenom:
          type: string
        nom:
          type: string
        pseudo:
          type: string
        email:
          type: string
        bio:
          type: string
        photo:
          type: string
        role_id:
          type: integer
        created_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required:
        - prenom
        - nom
        - pseudo
      properties:
        prenom:
          type: string
        nom:
          type: string
        pseudo:
          type: string
        bio:
          type: string

    UserUpdate:
      type: object
      properties:
        prenom:
          type: string
        nom:
          type: string
        pseudo:
          type: string
        bio:
          type: string
        photo:
          type: string

    Rating:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        oeuvre_id:
          type: integer
        note:
          type: number
          minimum: 0
          maximum: 5
        contenu:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RatingCreate:
      type: object
      required:
        - note
        - titre
        - description
      properties:
        note:
          type: number
          minimum: 0
          maximum: 5
          description: Note entre 0 et 5
        contenu:
          type: string
          description: Texte de la critique (optionnel)
        titre:
          type: string
          description: Titre de l'oeuvre (requis pour la créer en base si elle n'existe pas encore)
        description:
          type: string
          description: Description de l'oeuvre (requis pour la créer en base si elle n'existe pas encore)

    RatingStats:
      type: object
      properties:
        oeuvre_id:
          type: integer
        moyenne:
          type: number
        total:
          type: integer
        distribution:
          type: object

    Commentaire:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        critique_id:
          type: integer
        contenu:
          type: string
          maxLength: 2000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CommentaireCreate:
      type: object
      required:
        - contenu
      properties:
        contenu:
          type: string
          maxLength: 2000

    Liste:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        nom:
          type: string
        description:
          type: string
        visibilite:
          type: string
          enum: [PUBLIQUE, PRIVEE]
        created_at:
          type: string
          format: date-time

    ListeCreate:
      type: object
      required:
        - nom
      properties:
        nom:
          type: string
        description:
          type: string
        visibilite:
          type: string
          enum: [PUBLIQUE, PRIVEE]
          default: PRIVEE

    ListeUpdate:
      type: object
      properties:
        nom:
          type: string
        description:
          type: string
        visibilite:
          type: string
          enum: [PUBLIQUE, PRIVEE]

    Statut:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: A_VOIR
        libele:
          type: string
          example: À voir

    BibliothequeItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        oeuvre_id:
          type: integer
        titre:
          type: string
        description:
          type: string
        api_reference_id:
          type: string
        statut:
          $ref: '#/components/schemas/Statut'
        updated_at:
          type: string
          format: date-time

    BibliothequeItemCreate:
      type: object
      required:
        - api_reference_id
        - titre
        - description
      properties:
        api_reference_id:
          type: string
          description: Identifiant dans l'API externe. L'oeuvre est créée en base si elle n'existe pas encore.
        titre:
          type: string
        description:
          type: string
        statut_id:
          type: integer
          description: "ID du statut souhaité (ex: 1=A_VOIR, 2=EN_COURS, 3=VU)"
          default: 1

    BibliothequeItemUpdate:
      type: object
      properties:
        statut_id:
          type: integer
          description: "ID du statut souhaité (ex: 1=A_VOIR, 2=EN_COURS, 3=VU)"

    BibliothequeStats:
      type: object
      properties:
        total:
          type: integer
          description: Nombre total d'items dans la bibliothèque
        oeuvres_uniques:
          type: integer
          description: Nombre d'oeuvres distinctes
        derniere_mise_a_jour:
          type: string
          format: date-time
          nullable: true
          description: Date de la dernière modification
        par_statut:
          type: object
          description: Répartition du nombre d'items par statut
          additionalProperties:
            type: integer
          example:
            A_VOIR: 5
            EN_COURS: 3
            VU: 4

    FollowStats:
      type: object
      properties:
        followers:
          type: integer
        following:
          type: integer

    Notification:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
          description: ID du destinataire
        type:
          type: string
          enum: [like, commentaire, follow]
          description: Type d'événement qui a déclenché la notification
        source_id:
          type: integer
          description: ID de la ressource liée (critique_id pour like/commentaire, user_id pour follow)
        lu:
          type: boolean
          description: Notification lue ou non
        created_at:
          type: string
          format: date-time
        from_user_id:
          type: integer
          description: ID de l'utilisateur qui a déclenché l'action
        from_pseudo:
          type: string
          description: Pseudo de l'utilisateur émetteur
        from_photo:
          type: string
          nullable: true
          description: Photo de l'utilisateur émetteur
        oeuvre_id:
          type: integer
          nullable: true
          description: |
            ID de l'oeuvre liée. Renseigné uniquement pour les types `like` et `commentaire`
            (source_id = critique_id → oeuvre_id récupéré via JOIN). Null pour `follow`.

    NotificationList:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unreadCount:
          type: integer
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer

    FeedItem:
      type: object
      description: Entrée du fil d'actualité. Les champs disponibles varient selon le type.
      properties:
        type:
          type: string
          enum: [critique, commentaire, liste]
          description: Nature de l'activité
        id:
          type: integer
          description: ID de la ressource (critique, commentaire ou liste)
        created_at:
          type: string
          format: date-time
        author_id:
          type: integer
        author_pseudo:
          type: string
        author_photo:
          type: string
          nullable: true
        contenu:
          type: string
          nullable: true
          description: Texte de la critique, du commentaire ou description de la liste
        note:
          type: number
          nullable: true
          description: Note (uniquement pour type=critique)
        oeuvre_titre:
          type: string
          nullable: true
          description: Titre de l'oeuvre liée (critique ou commentaire)
        oeuvre_api_ref:
          type: string
          nullable: true
        liste_nom:
          type: string
          nullable: true
          description: Nom de la liste (uniquement pour type=liste)
        liste_visibilite:
          type: string
          nullable: true

    FeedList:
      type: object
      properties:
        feed:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer

    Error:
      type: object
      properties:
        error:
          type: string

    Oeuvre:
      type: object
      properties:
        id:
          type: integer
        api_reference_id:
          type: string
          description: Identifiant de l'oeuvre dans l'API externe (ex. RAWG, IGDB, TMDB…)
        titre:
          type: string
        description:
          type: string

    OeuvreRef:
      type: object
      description: Référence à une oeuvre via l'API externe. L'oeuvre est créée en base si elle n'existe pas encore.
      required:
        - api_reference_id
        - titre
        - description
      properties:
        api_reference_id:
          type: string
          description: Identifiant dans l'API externe
        titre:
          type: string
        description:
          type: string

    Success:
      type: object
      properties:
        message:
          type: string

tags:
  - name: Oeuvres
    description: Référentiel d'oeuvres (résolution automatique via api_reference_id)
  - name: Users
    description: Gestion des utilisateurs
  - name: Followers
    description: Système de follow/unfollow
  - name: Critiques
    description: Notes et critiques des oeuvres
  - name: Commentaires
    description: Commentaires sur les critiques
  - name: Bibliotheque
    description: Bibliothèque personnelle de l'utilisateur
  - name: Listes
    description: Listes personnalisées d'oeuvres
  - name: Notifications
    description: Système de notifications (likes, commentaires, follows) avec push temps réel SSE
  - name: Feed
    description: Fil d'actualité chronologique des utilisateurs suivis
  - name: Admin
    description: Actions réservées aux administrateurs (role_id=3)
  - name: Modération
    description: Actions accessibles aux modérateurs et administrateurs (role_id>=2)

paths:

  # ==================== USERS ====================

  /users:
    get:
      tags: [Users]
      summary: Rechercher des utilisateurs par pseudo
      description: Retourne la liste des utilisateurs dont le pseudo correspond à la recherche (correspondance partielle). Limité à 20 résultats.
      parameters:
        - name: search
          in: query
          required: true
          description: Pseudo ou partie du pseudo à rechercher
          schema:
            type: string
            example: bastien
      responses:
        '200':
          description: Liste des utilisateurs correspondants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    pseudo:
                      type: string
                    prenom:
                      type: string
                    nom:
                      type: string
                    photo:
                      type: string
                      nullable: true
                    bio:
                      type: string
                      nullable: true
        '400':
          description: Paramètre search manquant ou vide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me:
    get:
      tags: [Users]
      summary: Récupérer l'utilisateur connecté
      description: Retourne les données de l'utilisateur authentifié. Retourne 404 avec is_new=true si le profil n'existe pas encore.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Profil non créé (nouvel utilisateur)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  is_new:
                    type: boolean
                  prefill:
                    type: object
                    properties:
                      email:
                        type: string
                      photo:
                        type: string
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/create:
    post:
      tags: [Users]
      summary: Créer un profil utilisateur
      description: Crée le profil après la première connexion Auth0. L'email et la photo sont extraits du token JWT.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Profil créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Champs obligatoires manquants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Pseudo ou email déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      tags: [Users]
      summary: Récupérer un utilisateur par ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: ID invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Users]
      summary: Modifier un utilisateur
      description: Nécessite d'être le propriétaire ou un admin (role_id=3).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Aucune donnée à mettre à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission refusée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Pseudo déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Users]
      summary: Supprimer un utilisateur
      description: Nécessite d'être le propriétaire ou un admin (role_id=3).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Utilisateur supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission refusée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/ratings:
    get:
      tags: [Users]
      summary: Récupérer toutes les notes d'un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Liste des notes
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/ratings/{oeuvreId}:
    get:
      tags: [Users]
      summary: Récupérer la note d'un utilisateur pour une oeuvre spécifique
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: oeuvreId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Note trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '404':
          description: Note non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== FOLLOWERS ====================

  /users/{id}/follow:
    post:
      tags: [Followers]
      summary: Suivre un utilisateur
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur à suivre
      responses:
        '201':
          description: Abonnement créé
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Impossible de se suivre soi-même
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Déjà abonné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Followers]
      summary: Ne plus suivre un utilisateur
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur à ne plus suivre
      responses:
        '200':
          description: Désabonnement réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Abonnement non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/followers:
    get:
      tags: [Followers]
      summary: Récupérer les abonnés d'un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Liste des abonnés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: ID invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/following:
    get:
      tags: [Followers]
      summary: Récupérer les abonnements d'un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Liste des abonnements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: ID invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/follow-stats:
    get:
      tags: [Followers]
      summary: Récupérer les statistiques de suivi d'un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Statistiques de suivi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowStats'
        '400':
          description: ID invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/is-following:
    get:
      tags: [Followers]
      summary: Vérifier si l'utilisateur connecté suit un autre utilisateur
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de l'utilisateur cible
      responses:
        '200':
          description: Résultat de la vérification
          content:
            application/json:
              schema:
                type: object
                properties:
                  isFollowing:
                    type: boolean
        '400':
          description: ID invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== CRITIQUES ====================

  /critiques/{id}/ratings:
    get:
      tags: [Critiques]
      summary: Récupérer toutes les notes d'une oeuvre
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: api_reference_id de l'oeuvre (référence API externe)
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: orderBy
          in: query
          schema:
            type: string
            default: created_at
        - name: order
