          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notifications/stream:
    get:
      tags: [Notifications]
      summary: Connexion SSE — réception des notifications en temps réel
      description: |
        Ouvre une connexion **Server-Sent Events** persistante. Le serveur pousse
        un événement `notification` dès qu'une nouvelle notification est créée pour l'utilisateur.

        **Format des événements reçus :**
        ```
        event: connected
        data: {"userId": 42}

        event: notification
        data: {"id":1,"type":"like","from_pseudo":"alice",...}

        : ping
        ```

        Le client doit se reconnecter automatiquement si la connexion est interrompue
        (comportement natif de l'API `EventSource`).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Flux SSE ouvert
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Non authentifié
        '500':
          description: Erreur serveur

